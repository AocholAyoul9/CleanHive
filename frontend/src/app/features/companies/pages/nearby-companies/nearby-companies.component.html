<div class="layout">
  <div class="search-bar">
    <div class="search-input-wrapper" [class.focused]="searchFocused">
      <i class="fas fa-search search-icon"></i>

      <input
        type="text"
        class="search-input"
        placeholder="Adresse, ville ou code postal..."
        [value]="searchQuery"
        (input)="onSearchInput($event)"
        (focus)="onSearchFocus(); searchFocused = true"
        (blur)="clearSuggestions(); searchFocused = false"
        (keydown.escape)="clearSuggestions()"
        (keydown.enter)="onSearchEnter()"
        inputmode="search"
        autocomplete="off"
      />

      <button class="geo-btn" (click)="useMyLocation()" [disabled]="geolocationLoading()" title="Utiliser ma position">
        <i class="fas fa-location-crosshairs" *ngIf="!geolocationLoading()"></i>
        <span class="spinner" *ngIf="geolocationLoading()"></span>
      </button>
    </div>

    <div class="suggestions-dropdown" *ngIf="addressSuggestions.length > 0">
      <button class="suggestion-item" *ngFor="let suggestion of addressSuggestions" (mousedown)="selectAddressSuggestion(suggestion)">
        <i class="fas fa-location-dot"></i>
        <div class="suggestion-text">
          <span class="suggestion-main">{{ suggestion.structured_formatting?.main_text || suggestion.description }}</span>
          <span class="suggestion-secondary">{{ suggestion.structured_formatting?.secondary_text || '' }}</span>
        </div>
      </button>
    </div>

    <div class="filter-chips" *ngIf="activeFilter">
      <span class="chip">
        {{ activeFilter }}
        <button (click)="clearFilter()"><i class="fas fa-times"></i></button>
      </span>
    </div>
  </div>

  <aside class="list">
    <div class="list-header">
      <div class="list-header-top">
        <h3>Entreprises proches</h3>
        <span class="count-badge">{{ sortedCompanies.length }}</span>
      </div>
      <p class="list-subtitle" *ngIf="searchQuery">
        <i class="fas fa-location-dot"></i> {{ searchQuery }}
      </p>

      <div class="sort-row">
        <button class="sort-btn" [class.active]="sortBy === 'distance'" (click)="setSortBy('distance')">
          <i class="fas fa-map-pin"></i> Distance
        </button>
        <button class="sort-btn" [class.active]="sortBy === 'rating'" (click)="setSortBy('rating')">
          <i class="fas fa-star"></i> Note
        </button>
        <button class="sort-btn" [class.active]="sortBy === 'available'" (click)="setSortBy('available')">
          <i class="fas fa-circle-check"></i> Disponibles
        </button>
      </div>
    </div>

    <app-company-cards
      [companies]="sortedCompanies"
      [selectedCompany]="selectedCompany()"
      [loading]="loading()"
      (companySelected)="selectCompany($event)"
      (bookCompany)="bookCompany($event)"
    ></app-company-cards>
  </aside>

  <main class="map">
    <app-company-map
      [companies]="sortedCompanies"
      [center]="mapCenter()"
      [selectedCompany]="selectedCompany()"
      [userLocation]="userLocation()"
      (companySelected)="onMapCompanySelected($event)"
      (bookCompany)="bookCompany($event)"
    ></app-company-map>

    <div class="map-legend">
      <div class="legend-title">🗺️ Légende</div>
      <div class="legend-item">
        <span class="legend-marker available"></span>
        <span>Disponible</span>
      </div>
      <div class="legend-item">
        <span class="legend-marker unavailable"></span>
        <span>Indisponible</span>
      </div>
      <div class="legend-item">
        <span class="legend-marker price">€</span>
        <span>Prix (€ = -50€, €€ = 50-80€, €€€ = 80€+)</span>
      </div>
    </div>

    <button class="sheet-toggle" (click)="toggleSheet()" *ngIf="!sheetOpen()">
      <i class="fas fa-list"></i>
      <span>{{ sortedCompanies.length }} entreprises</span>
      <i class="fas fa-chevron-up"></i>
    </button>

    <div class="radius-control">
      <label>Rayon</label>
      <select [(ngModel)]="currentRadius" (change)="onRadiusChange()">
        <option [value]="5">5 km</option>
        <option [value]="10">10 km</option>
        <option [value]="20">20 km</option>
        <option [value]="50">50 km</option>
      </select>
    </div>
  </main>

  <div class="bottom-sheet" [class.open]="sheetOpen()">
    <div class="sheet-handle-bar" (click)="toggleSheet()">
      <div class="handle"></div>
      <div class="sheet-header-row">
        <span class="sheet-title">{{ sortedCompanies.length }} entreprises à proximité</span>
        <button class="sheet-close" (click)="closeSheet()"><i class="fas fa-times"></i></button>
      </div>
    </div>

    <div class="sheet-content">
      <app-company-cards
        [companies]="sortedCompanies"
        [selectedCompany]="selectedCompany()"
        [loading]="loading()"
        (companySelected)="selectCompany($event); closeSheet()"
        (bookCompany)="bookCompany($event)"
      ></app-company-cards>
    </div>
  </div>

  <div class="sheet-backdrop" *ngIf="sheetOpen()" (click)="closeSheet()"></div>

  <app-booking-modal
    [open]="bookingModalOpen()"
    [company]="bookingCompany()"
    [initialAddress]="searchQuery"
    (closed)="closeBookingModal()"
  ></app-booking-modal>
</div>
